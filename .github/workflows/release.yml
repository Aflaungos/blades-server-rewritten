name: Build and publish arena-server

# Merging a PR here publishes a container image. The box pulls it; the box never
# builds it.
#
# WHY NOT BUILD ON THE BOX
#
# The runbook's deploy step is an on-box `docker build --no-cache`, and it is a
# bad step three times over:
#
#   * The box has 2 vCPUs and ~1.9 GB of RAM. The Dockerfile's own header warns
#     the release build OOMs there; the documented workaround is to build a
#     DEBUG binary in production. A heavy build on this box has taken the whole
#     thing down before, and it hosts someone else's site too.
#   * `COPY . .` sits before `cargo build`, so any source change busts the
#     dependency layer and all 292 crates recompile — ~7 minutes of both cores.
#   * Forgetting `--no-cache` silently ships a stale binary. `deploy/arena.sh
#     build` does not pass it, despite a comment claiming arena builds do.
#
# A GitHub runner is 4 vCPU / 16 GB and free for public repos. It builds from a
# known-clean checkout, so the stale-layer question disappears rather than being
# managed.
#
# NO SECRETS ARE INVOLVED. The registry is this repository's own package
# namespace and the token is the automatic per-run GITHUB_TOKEN — nothing to
# rotate, nothing that could leak from a fork PR (this job does not run on PRs).
# The package is public, so the box pulls it anonymously and needs no
# credentials either.

on:
  push:
    branches: [main]
    # A push that cannot change the image must not publish one.
    #
    # This is not tidiness. cla.yml runs on `pull_request_target` with
    # `contents: write` and appends the acceptance row by committing
    # CLA-ACCEPTANCES.md straight to `pr.base.ref` — main. So an OUTSIDE
    # contributor, by opening a pull request and accepting the CLA, pushed to
    # main, which triggered this workflow, which published a new
    # ghcr.io/.../blades-arena-server image, whose new digest the box's
    # blades-arena-image-watch timer treats as a release and hands to
    # `newblades-deploy-apply arena-pull-up` — restarting the LIVE game server.
    #
    # No third-party code ever ran (this job checks out main, and the CLA commit
    # touches one Markdown file), so the image was byte-identical in substance.
    # The problem is that a stranger could bounce production, unreviewed and
    # unannounced, by doing exactly what the CLA asks them to do.
    #
    # Ignoring the ledger and the docs closes it at the trigger, which is the
    # only place that holds for every future writer to main. `workflow_dispatch`
    # is still there for the rare case of wanting to republish anyway.
    paths-ignore:
      - 'CLA-ACCEPTANCES.md'
      - 'CLA.md'
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Serialised so two builds cannot race to publish `:main`. The runs are NOT
# cancelled on top of each other (`cancel-in-progress: false`), but GitHub still
# keeps only the most recently QUEUED run per group and cancels the rest — and
# "most recently queued" is not "newest commit". On 2026-09-16, five PRs merged
# within 30 seconds: three release runs were cancelled and the survivor was the
# run for an OLDER commit, so two merged fixes were never built. They reached
# production only because an unrelated push happened to rebuild main minutes
# later.
#
# The cull is fine; building the event's own commit was not. Both jobs below
# check out `main` rather than the triggering SHA, so whichever run survives
# publishes whatever main is at that moment. A dropped run then costs nothing:
# the survivor already contains its commits.
concurrency:
  group: arena-release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/blades-arena-server

jobs:
  # The gate. Publishing an image that fails its own tests would just move the
  # breakage closer to production.
  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # `ref: main`, not the event SHA — see the concurrency note above.
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: sudo apt-get update && sudo apt-get install -y pkg-config
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: cargo test --workspace --locked

  publish:
    needs: test
    name: build + push image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # `ref: main`, not the event SHA — see the concurrency note above. The
      # image is tagged from the checked-out HEAD below, so the sha- tag and the
      # revision label describe what was actually built.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: log in to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Plain docker CLI rather than docker/build-push-action: this needs no
      # buildx features, and every third-party action is supply-chain surface on
      # a job that can publish what production runs.
      - name: build
        run: |
          set -euo pipefail
          # Both derived from the CHECKED-OUT commit. $GITHUB_SHA is the event's
          # commit, which is not necessarily what we just checked out, and a
          # revision label that lies is worse than none: verifying a deploy on the
          # box reads exactly this label.
          BUILT_SHA="$(git rev-parse HEAD)"
          SHA_TAG="sha-$(git rev-parse --short HEAD)"
          echo "SHA_TAG=$SHA_TAG" >> "$GITHUB_ENV"
          echo "building $BUILT_SHA (event was $GITHUB_SHA)"
          docker build --build-arg VCS_REF="$BUILT_SHA" -t "$IMAGE:$SHA_TAG" -t "$IMAGE:main" .

      - name: push
        run: |
          set -euo pipefail
          docker push "$IMAGE:$SHA_TAG"
          docker push "$IMAGE:main"
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$IMAGE:$SHA_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$IMAGE:main\` (what the box tracks)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The box picks this up within ~5 min via blades-arena-deploy.timer." >> "$GITHUB_STEP_SUMMARY"
          echo "To roll back, pin the previous \`sha-…\` tag — see docs/the-loop.md." >> "$GITHUB_STEP_SUMMARY"
